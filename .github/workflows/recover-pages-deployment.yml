name: Recover a stuck Pages deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages-deployment.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Clear orphaned GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_SHA: 6caf7acc7148f474dd55da7d2204b571d443aba6
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/${REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST "${headers[@]}" "${base}/pages/deployments/${STALE_SHA}/cancel")
          echo "Cancel old Pages deployment: HTTP ${code}"
          if [ "${code}" != 204 ] && [ "${code}" != 404 ]; then cat /tmp/cancel.json; exit 1; fi
          list_code=$(curl -sS -o /tmp/deployments.json -w '%{http_code}' "${headers[@]}" "${base}/deployments?per_page=100")
          echo "Read deployment records: HTTP ${list_code}"
          if [ "${list_code}" != 200 ]; then cat /tmp/deployments.json; exit 1; fi
          ids=$(jq -r --arg SHA "${STALE_SHA}" '.[] | select(.sha == $SHA and .environment == "github-pages") | .id' /tmp/deployments.json)
          for id in ${ids}; do
            echo "Remove orphaned deployment record ${id} for ${STALE_SHA}"
            status_code=$(curl -sS -o /tmp/inactive.json -w '%{http_code}' -X POST "${headers[@]}" -H "Content-Type: application/json" -d '{"state":"inactive","description":"Clear obsolete GitHub Pages deployment"}' "${base}/deployments/${id}/statuses")
            echo "Mark inactive: HTTP ${status_code}"
            if [ "${status_code}" != 201 ] && [ "${status_code}" != 200 ]; then cat /tmp/inactive.json; exit 1; fi
            delete_code=$(curl -sS -o /tmp/deleted.json -w '%{http_code}' -X DELETE "${headers[@]}" "${base}/deployments/${id}")
            echo "Delete orphaned deployment: HTTP ${delete_code}"
            if [ "${delete_code}" != 204 ]; then cat /tmp/deleted.json; exit 1; fi
          done
          if [ -z "${ids}" ]; then echo "No deployment record for stale SHA; Pages cancellation requested."; fi
