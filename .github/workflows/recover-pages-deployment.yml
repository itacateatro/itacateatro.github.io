name: Recover a stuck Pages deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages-deployment.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the blocking Pages deployment from 2026-11-05
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${REPOSITORY}/pages/deployments/6caf7acc7148f474dd55da7d2204b571d443aba6/cancel"
          code=$(curl --silent --show-error --output /tmp/pages-cancel.json --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$endpoint")
          echo "Pages cancel HTTP status: $code"
          if [ -s /tmp/pages-cancel.json ]; then cat /tmp/pages-cancel.json; fi
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then exit 1; fi
